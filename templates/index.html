<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>

<style>

body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffd1dc,#ffe6f0);
    overflow-x:hidden;
    text-align:center;
    color:#444;
}

/* Opening Screen */
#startScreen {
    position:fixed;
    width:100%;
    height:100vh;
    background:linear-gradient(135deg,#ffb6c1,#ffd1dc);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
}

button {
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
    background:white;
    color:#ff4d6d;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    margin:5px;
}

.container {
    padding:20px;
    max-width:600px;
    margin:auto;
}

/* Floating hearts */
.heart {
    position:fixed;
    bottom:-20px;
    color:#ff6b81;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from {transform:translateY(0); opacity:1;}
    to {transform:translateY(-100vh); opacity:0;}
}

/* Typing effect */
#typing {
    font-size:20px;
    min-height:60px;
    margin-top:20px;
}

/* Valentine buttons */
#valentineSection {
    margin-top:40px;
}

#noBtn {
    position:relative;
}

/* Heart explosion */
.explosion-heart {
    position:fixed;
    font-size:20px;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    to {
        transform:translate(var(--x),var(--y));
        opacity:0;
    }
}

/* Quiz */
#quiz {
    display:none;
    margin-top:30px;
}

.option {
    display:block;
    margin:10px auto;
    width:80%;
}

/* Certificate */
#certificate {
    display:none;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    margin-top:30px;
}

</style>
</head>

<body>

<!-- Opening Screen -->
<div id="startScreen">
    <h1>❤️ A Special Surprise ❤️</h1>
    <button onclick="enterSite()">Enter</button>
</div>

<div class="container">

<h1>Happy Valentine's Day ❤️</h1>

<div id="typing"></div>

<h3 id="counter"></h3>

<!-- Valentine Question -->
<div id="valentineSection">
    <h2>Will you be my Valentine? 💖</h2>
    <button onclick="yesClicked()">Yes 💕</button>
    <button id="noBtn" onmouseover="moveNo()">No 😢</button>
</div>

<h2 id="loveMessage" style="display:none;">
    oo myyy gawwwdd, i wish i was there to kisss youuu
</h2>

<!-- QUIZ -->
<div id="quiz">
    <h3 id="quizTitle"></h3>
    <p id="question"></p>
    <div id="options"></div>
    <p id="quizResult"></p>
</div>

<!-- FINAL LOVE CERTIFICATE -->
<div id="certificate">
    <h2>❤️ i lovie you so much ❤️</h2>
</div>

</div>

<script>

/* Enter website */
function enterSite(){
    document.getElementById("startScreen").style.display="none";
}

/* Floating hearts */
setInterval(()=>{
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},500);

/* Typing animation */
const message="Every moment with you feels like a beautiful dream. Thank you for being in my life. can't be more grateful. can't wait to spend more more valentines with you❤️";
let i=0;
function typeWriter(){
    if(i<message.length){
        document.getElementById("typing").innerHTML+=message.charAt(i);
        i++;
        setTimeout(typeWriter,40);
    }
}
typeWriter();

/* Love counter */
const startDate=new Date("2024-11-14");
setInterval(()=>{
    let now=new Date();
    let diff=Math.floor((now-startDate)/(1000*60*60*24));
    document.getElementById("counter").innerText=
    diff+" days of loving you ❤️";
},1000);

/* No button runs away */
function moveNo(){
    const btn=document.getElementById("noBtn");
    btn.style.position="absolute";
    btn.style.left=Math.random()*80+"%";
    btn.style.top=Math.random()*80+"%";
}

/* Yes clicked */
function yesClicked(){
    document.getElementById("loveMessage").style.display="block";
    heartExplosion();
    document.getElementById("quiz").style.display="block";
    loadQuestion();
}

/* Heart explosion */
function heartExplosion(){
    for(let i=0;i<20;i++){
        let h=document.createElement("div");
        h.className="explosion-heart";
        h.innerHTML="❤️";
        h.style.left="50%";
        h.style.top="50%";
        h.style.setProperty("--x",(Math.random()*400-200)+"px");
        h.style.setProperty("--y",(Math.random()*400-200)+"px");
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),1000);
    }
}

/* QUIZ DATA */

const quizData = [
{
    type:"mcq",
    question:"When did we first meet properly?",
    options:["College Fest","College Freshers","Classroom","Somewhere out"],
    correct:1,
    correctMsg:"yayayay 🎉",
    wrongMsg:"ye to yaad hona chaahiye tha 😒"
},
{
    type:"mcq",
    question:"What was I wearing when you got attracted?",
    options:["Yellow Dress","Chupp no more options"],
    correct:0,
    correctMsg:"yayayaya 💕",
    wrongMsg:"wrong answer 😌"
},
{
    type:"text",
    question:"When did you finally fell for me?",
    correctMsg:"awwieee 🥰"
},
{
    type:"mcq",
    question:"When are we going to end our relationship?",
    options:["7 janamo ke baad","32 feb","No more options"],
    correct:1,
    correctMsg:"yayayaya ❤️",
    wrongMsg:"😭"
}
];

let currentQuestion = 0;

/* Load question */
function loadQuestion(){
    let q = quizData[currentQuestion];

    document.getElementById("quizTitle").innerText =
        "Round " + (currentQuestion+1) + " 💌";

    document.getElementById("question").innerText = q.question;

    let optionsHTML = "";

    if(q.type === "mcq"){
        q.options.forEach((opt,index)=>{
            optionsHTML +=
            `<button class="option" onclick="checkAnswer(${index})">${opt}</button>`;
        });
    }

    if(q.type === "text"){
        optionsHTML = `
            <input id="textAnswer" placeholder="Write your answer..."
            style="padding:10px;border-radius:10px;border:1px solid #ccc;width:80%;">
            <br><br>
            <button onclick="submitTextAnswer()">Submit</button>
        `;
    }

    document.getElementById("options").innerHTML = optionsHTML;
    document.getElementById("quizResult").innerText = "";
}

/* MCQ answer */
function checkAnswer(index){
    let q = quizData[currentQuestion];
    let result = document.getElementById("quizResult");

    if(index === q.correct){
        result.innerText = q.correctMsg;
        setTimeout(nextQuestion,1200);
    } else {
        result.innerText = q.wrongMsg;
    }
}

/* Text answer */
function submitTextAnswer(){
    let q = quizData[currentQuestion];
    document.getElementById("quizResult").innerText = q.correctMsg;
    setTimeout(nextQuestion,1200);
}

/* Next question */
function nextQuestion(){
    currentQuestion++;

    if(currentQuestion < quizData.length){
        loadQuestion();
    } else {
        document.getElementById("quiz").style.display="none";
        document.getElementById("certificate").style.display="block";
    }
}

</script>

</body>
</html>
